# This block routes traffic from https://coact-ai.com/supabase -> http://localhost:8000
location /supabase/ {
    # Strip the /supabase path so Supabase gets the clean request (e.g. /rest/v1)
    rewrite ^/supabase/(.*)$ /$1 break;
    
    proxy_pass http://localhost:8000;
    
    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket Support (Important for Realtime/Storage)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts for longer queries
    proxy_connect_timeout 75s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
